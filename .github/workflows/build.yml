name: Build HomeKeys (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Configurer (Visual Studio, 64 bits)
        run: |
          cmake --version
          cmake -B build -A x64

      - name: Compiler le VST3
        run: cmake --build build --config Release --target HomeKeys_VST3 HomeKeys_Standalone --parallel

      - name: Preparer le paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/HomeKeys_artefacts/Release/VST3/HomeKey I.vst3" "package/HomeKey I.vst3"
          Copy-Item "build/HomeKeys_artefacts/Release/Standalone/HomeKey I.exe" "package/HomeKey I.exe"
          Copy-Item "INSTALLATION.txt" "package/INSTALLATION.txt"
          Copy-Item "CREDITS.txt" "package/CREDITS.txt"
          Copy-Item -Recurse "HomeKey Preset" "package/HomeKey Preset"

      - name: Telecharger le resultat
        uses: actions/upload-artifact@v5
        with:
          name: HomeKeys-Windows-VST3
          path: package

      - name: Publier le zip dans la branche builds
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath HomeKeyI-Windows.zip -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf --cached . | Out-Null
          git add -f HomeKeyI-Windows.zip
          git commit -m "Build ${{ github.sha }}"
          git push -f origin builds
