name: Build HomeKeys (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer (Visual Studio 2022, 64 bits)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compiler le VST3
        run: cmake --build build --config Release --target HomeKeys_VST3 HomeKeys_Standalone --parallel

      - name: Preparer le paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/HomeKeys_artefacts/Release/VST3/HomeKeys.vst3" "package/HomeKeys.vst3"
          Copy-Item "build/HomeKeys_artefacts/Release/Standalone/HomeKeys.exe" "package/HomeKeys.exe"
          Copy-Item "INSTALLATION.txt" "package/INSTALLATION.txt"

      - name: Telecharger le resultat
        uses: actions/upload-artifact@v4
        with:
          name: HomeKeys-Windows-VST3
          path: package
