name: Build HomeKey I + One Compress + Spider (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Configurer (Visual Studio, 64 bits)
        run: |
          cmake --version
          cmake -B build -A x64

      - name: Compiler le VST3
        run: cmake --build build --config Release --target HomeKeys_VST3 HomeKeys_Standalone --parallel

      - name: Preparer le paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/HomeKeys_artefacts/Release/VST3/HomeKey I.vst3" "package/HomeKey I.vst3"
          Copy-Item "build/HomeKeys_artefacts/Release/Standalone/HomeKey I.exe" "package/HomeKey I.exe"
          Copy-Item "INSTALLATION.txt" "package/INSTALLATION.txt"
          Copy-Item "CREDITS.txt" "package/CREDITS.txt"
          Copy-Item -Recurse "HomeKey Preset" "package/HomeKey Preset"

      - name: Compiler One Compress
        run: |
          cmake -S OneCompress -B build-oc -A x64
          cmake --build build-oc --config Release --target OneCompress_VST3 OneCompress_Standalone --parallel

      - name: Preparer le paquet One Compress
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-oc | Out-Null
          Copy-Item -Recurse "build-oc/OneCompress_artefacts/Release/VST3/One Compress.vst3" "package-oc/One Compress.vst3"
          Copy-Item "build-oc/OneCompress_artefacts/Release/Standalone/One Compress.exe" "package-oc/One Compress.exe"
          Copy-Item "OneCompress/LISEZ-MOI.txt" "package-oc/LISEZ-MOI.txt"

      - name: Compiler Spider
        run: |
          cmake -S Spider -B build-sp -A x64
          cmake --build build-sp --config Release --target Spider_VST3 Spider_Standalone --parallel

      - name: Preparer le paquet Spider
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-sp | Out-Null
          Copy-Item -Recurse "build-sp/Spider_artefacts/Release/VST3/Spider.vst3" "package-sp/Spider.vst3"
          Copy-Item "build-sp/Spider_artefacts/Release/Standalone/Spider.exe" "package-sp/Spider.exe"
          Copy-Item "Spider/LISEZ-MOI.txt" "package-sp/LISEZ-MOI.txt"

      - name: Telecharger le resultat
        uses: actions/upload-artifact@v5
        with:
          name: HomeKeys-Windows-VST3
          path: package

      - name: Publier le zip dans la branche builds
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath HomeKeyI-Windows.zip -Force
          Compress-Archive -Path package-oc/* -DestinationPath OneCompress-Windows.zip -Force
          Compress-Archive -Path package-sp/* -DestinationPath Spider-Windows.zip -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf --cached . | Out-Null
          git add -f HomeKeyI-Windows.zip OneCompress-Windows.zip Spider-Windows.zip
          git commit -m "Build ${{ github.sha }}"
          git push -f origin builds
